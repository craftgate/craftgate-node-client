name: Build Craftgate Node.js Client

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    name: Build the Library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js version 12.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "12.x"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Release dry run: the library is built, tested and packed the way the release workflow does it,
      # with a fake "v" prefixed version; the runtime checks verify the version in the x-client-version header.
      - name: Validate Fake Release Version
        run: .github/scripts/prepare-release.sh v9.9.9

      - name: Set Version
        run: npm version --allow-same-version --no-git-tag-version "$VERSION"

      - name: Build the Library
        run: npm run build

      - name: Run Tests
        run: npm run test

      - name: Package Artifacts
        run: |
          .github/scripts/pack-artifacts.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-library
          path: ${{ env.ARTIFACT_FILENAME }}
          if-no-files-found: error

      - name: Upload Runtime Check Script
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-check-script
          path: .github/scripts/check-runtime.js

  test-runtime:
    name: Test Runtime on Node Versions
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 4.x, 6.x, 8.x, 10.x, 12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x, 26.x ]

    steps:
      - name: Use Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Switch Directories
        run: |
          cd /home/runner/work/craftgate-node-client/
          mkdir check-runtime
          cd check-runtime
          npm init -y

      - name: Download Packed Library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-library
          path: /home/runner/work/craftgate-node-client/check-runtime/

      - name: Download Runtime Check Script
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-check-script
          path: /home/runner/work/craftgate-node-client/check-runtime/

      - name: Execute Runtime Checks
        working-directory: /home/runner/work/craftgate-node-client/check-runtime/
        env:
          EXPECTED_CLIENT_VERSION: 9.9.9
        run: |
          ls -R
          FILENAME=$(ls *.tgz | tail -n 1)
          npm i --ignore-scripts $FILENAME
          node check-runtime.js
