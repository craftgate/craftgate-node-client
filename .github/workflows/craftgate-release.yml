name: Release Craftgate Node.js Client

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build the Library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '12.x'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Set Version From Release Tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$RELEASE_TAG' must be in the form X.Y.Z or vX.Y.Z"
            exit 1
          fi
          npm version --allow-same-version --no-git-tag-version "$VERSION"

      - name: Build the Library
        run: npm run build

      - name: Run Tests
        run: npm run test

      - name: Package Artifacts
        run: |
          .github/scripts/pack-artifacts.sh

      - name: Upload Packed Library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-library
          path: ${{ env.ARTIFACT_FILENAME }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    environment: npm-publish
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Packed Library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packed-library
          path: ${{ runner.temp }}/packed-library


      - name: Publish to npm
        working-directory: ${{ runner.temp }}/packed-library
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --provenance --access public
