name: Release Craftgate Node.js Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (format: 1.2.3)"
        required: true
      publish_to_npm:
        description: "Publish the package to npm"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build the Library
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure branch context
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "::error::Release workflow must run against a branch ref."
            exit 1
          fi

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: .github/scripts/prepare-release.sh "$INPUT_VERSION"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '12.x'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Set Version
        run: npm version --allow-same-version --no-git-tag-version "$VERSION"

      - name: Build the Library
        run: npm run build

      - name: Run Tests
        run: npm run test

      - name: Package Artifacts
        run: |
          .github/scripts/pack-artifacts.sh

      - name: Upload Packed Library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-library
          path: ${{ env.ARTIFACT_FILENAME }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create tag
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Packed Library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-library
          path: ${{ runner.temp }}/packed-library

      - name: Publish to npm
        if: inputs.publish_to_npm == true
        working-directory: ${{ runner.temp }}/packed-library
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/packed-library/*.tgz
