version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the SHAs (and their version comments) up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a few days before adopting a freshly published release (security updates are not delayed)
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
